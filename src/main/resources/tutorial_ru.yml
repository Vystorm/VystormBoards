title: 'Табло'
permission: vystormboards.admin
pages:
  - title: 'Повесить табло'
    text: |
      Посмотрите на стену в место левого верхнего угла и введите /boards create.
  - title: 'Редактирование страниц'
    text: |
      /boards открывает редактор: картинки, живой текст, головы, кнопки и страницы.
  - title: 'Рейтинги и опросы'
    text: |
      Показывайте рейтинги через /boards top и проводите опросы прямо на табло.
      Введите /boards help, чтобы увидеть все команды.
