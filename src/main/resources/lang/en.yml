# /boards through Vystorm Core: description, help and tab completion per player. "aliases" under commands.boards are extra
# root commands (server-wide, the admin chooses which languages: Core config commands.localized-aliases); "name" and
# "aliases" of a subcommand are accepted in every language, English always works.
# Days in front of a board countdown ({countdown:2026-12-24T18:00}), e.g. "3d 04:12:09".
countdown-days: "{days}d"

poll-deadline: "<gray>Poll {poll} deadline: {time}"
poll-deadline-none: "<gray>Poll {poll} has no deadline."
poll-deadline-invalid: "<red>Use a future date/time such as 2026-12-24T18:00 (server time), or clear."

commands:
  boards:
    description: "Billboards: create, list and remove boards, rankings and polls"
    aliases: []
    sub:
      edit:
        name: edit
        aliases: []
        description: "Board page editor"
        args:
          name: NAME
      create:
        name: create
        aliases: []
        description: "Hang a new board on the wall you look at (top-left corner); from the console with world, position and facing"
        args:
          name: NAME
          width: WIDTH
          height: HEIGHT
          world: WORLD
          x: X
          "y": "Y"
          z: Z
          facing: "north|east|south|west"
      info:
        name: info
        aliases: []
        description: "Size, position, elements, pages and click areas of a board"
        args:
          name: NAME
      list:
        name: list
        aliases: []
        description: "All boards with size and position"
      deadline:
        name: deadline
        aliases: []
        description: "Show or set a poll deadline in server time; clear removes it"
        args:
          id: ID
          time: "TIME|clear"
      poll:
        name: poll
        aliases: []
        description: "All polls, or the results of one poll; close, open or reset it"
        args:
          id: ID
          action: "close|open|reset"
          confirm: confirm
      guestbook:
        name: guestbook
        aliases: []
        description: "Guestbook entries: list, remove one or clear"
        args:
          id: ID
          action: "remove|clear"
          number: NUMBER
      photos:
        name: photos
        aliases: []
        description: "Make a board a slideshow of Snapshot photos"
        args:
          name: NAME
          source: SOURCE
      reload:
        name: reload
        aliases: []
        description: "Reload config, boards and language files"
      remove:
        name: remove
        aliases: []
        description: "Remove a board and its item frames"
        args:
          name: NAME
      render:
        name: render
        aliases: []
        description: "Render mode in use and packet counters"
      top:
        name: top
        aliases: []
        description: "Rankings in use, the first places of one source, or reset its stored values"
        args:
          source: SOURCE
          action: reset
          confirm: confirm
    values:
      close: close
      open: open
      reset: reset
      confirm: confirm
