# /boards über Vystorm Core: Beschreibung, Hilfe und Tab-Vervollständigung je Spieler. "aliases" unter commands.boards sind
# zusätzliche Hauptbefehle (serverweit, der Admin wählt die Sprachen: Core-Konfig commands.localized-aliases); "name" und
# "aliases" eines Unterbefehls werden in jeder Sprache verstanden, Englisch geht immer.
# Days in front of a board countdown ({countdown:2026-12-24T18:00}), e.g. "3d 04:12:09".
countdown-days: "{days} T."

poll-deadline: "<gray>Frist der Umfrage {poll}: {time}"
poll-deadline-none: "<gray>Umfrage {poll} hat keine Frist."
poll-deadline-invalid: "<red>Nutze einen zukünftigen Zeitpunkt wie 2026-12-24T18:00 (Serverzeit) oder clear."

commands:
  boards:
    description: "Anzeigetafeln: Tafeln erstellen, auflisten und entfernen, Ranglisten und Umfragen"
    aliases: [anzeigetafeln]
    sub:
      edit:
        name: edit
        aliases: []
        description: "Board-Seiteneditor"
        args:
          name: NAME
      create:
        name: erstellen
        aliases: []
        description: "Neue Tafel an die Wand hängen, die du ansiehst (linke obere Ecke); von der Konsole mit Welt, Position und Richtung"
        args:
          name: NAME
          width: BREITE
          height: HÖHE
          world: WELT
          x: X
          "y": "Y"
          z: Z
          facing: "north|east|south|west"
      info:
        name: info
        aliases: []
        description: "Größe, Position, Elemente, Seiten und Klickflächen einer Tafel"
        args:
          name: NAME
      list:
        name: liste
        aliases: []
        description: "Alle Tafeln mit Größe und Position"
      deadline:
        name: frist
        aliases: []
        description: "Umfragefrist in Serverzeit anzeigen oder setzen; clear entfernt sie"
        args:
          id: ID
          time: "ZEIT|clear"
      poll:
        name: umfrage
        aliases: []
        description: "Alle Umfragen oder die Ergebnisse einer Umfrage; schließen, öffnen oder zurücksetzen"
        args:
          id: ID
          action: "schließen|öffnen|zurücksetzen"
          confirm: bestätigen
      guestbook:
        name: guestbook
        aliases: []
        description: "Gästebuch-Einträge: auflisten, einen entfernen oder leeren"
        args:
          id: ID
          action: "remove|clear"
          number: NUMBER
      photos:
        name: fotos
        aliases: []
        description: "Eine Tafel zur Diashow mit Snapshot-Fotos machen"
        args:
          name: NAME
          source: SOURCE
      reload:
        name: neuladen
        aliases: []
        description: "Konfiguration, Tafeln und Sprachdateien neu laden"
      remove:
        name: entfernen
        aliases: []
        description: "Eine Tafel samt ihren Rahmen entfernen"
        args:
          name: NAME
      render:
        name: darstellung
        aliases: []
        description: "Verwendete Darstellungsart und Paket-Zähler"
      top:
        name: rangliste
        aliases: []
        description: "Verwendete Ranglisten, die ersten Plätze einer Quelle oder ihre gespeicherten Werte zurücksetzen"
        args:
          source: QUELLE
          action: zurücksetzen
          confirm: bestätigen
    values:
      close: [schließen, schliessen]
      open: [öffnen, oeffnen]
      reset: [zurücksetzen, zuruecksetzen]
      confirm: [bestätigen, bestaetigen]
navigation-invalid: "<red>Diese Seitenschaltfläche hat ein ungültiges Ziel oder die Tafel hat keine Seiten."
navigation-auto: "<green>Automatischer Seitenwechsel fortgesetzt."
navigation-page: "<gray>Seite {page} von {pages}."
feature-off: "<red>Diese Funktion ist auf diesem Server ausgeschaltet."

