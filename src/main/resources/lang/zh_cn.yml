# 通过 Vystorm Core 提供的 /boards：每位玩家看到自己语言的说明、帮助和 Tab 补全。commands.boards 下的 "aliases" 是额外的
# 主命令（全服生效，由管理员在 Core 配置 commands.localized-aliases 中选择语言）；子命令的 "name" 和 "aliases"
# 在所有语言中都可使用，英文始终有效。
# Days in front of a board countdown ({countdown:2026-12-24T18:00}), e.g. "3d 04:12:09".
countdown-days: "{days}天"

poll-deadline: "<gray>投票 {poll} 的截止时间：{time}"
poll-deadline-none: "<gray>投票 {poll} 没有截止时间。"
poll-deadline-invalid: "<red>请输入未来时间，例如 2026-12-24T18:00（服务器时间），或 clear。"

commands:
  boards:
    description: "看板：创建、列出和移除看板，排行榜和投票"
    aliases: [看板]
    sub:
      edit:
        name: edit
        aliases: []
        description: "告示板页面编辑器"
        args:
          name: NAME
      create:
        name: 创建
        aliases: []
        description: "在你看着的墙上挂一块新看板（左上角）；控制台需提供世界、位置和朝向"
        args:
          name: 名称
          width: 宽度
          height: 高度
          world: 世界
          x: X
          "y": "Y"
          z: Z
          facing: "north|east|south|west"
      info:
        name: 信息
        aliases: []
        description: "看板的尺寸、位置、元素、页面和点击区域"
        args:
          name: 名称
      list:
        name: 列表
        aliases: []
        description: "所有看板及其尺寸和位置"
      deadline:
        name: 截止
        aliases: []
        description: "查看或设置投票截止时间（服务器时间）；clear 清除截止时间"
        args:
          id: ID
          time: "时间|clear"
      poll:
        name: 投票
        aliases: []
        description: "所有投票，或某个投票的结果；关闭、开启或重置"
        args:
          id: ID
          action: "关闭|开启|重置"
          confirm: 确认
      guestbook:
        name: guestbook
        aliases: []
        description: "留言簿：列出、删除一条或清空"
        args:
          id: ID
          action: "remove|clear"
          number: NUMBER
      photos:
        name: 照片
        aliases: []
        description: "把展板变成 Snapshot 照片幻灯片"
        args:
          name: NAME
          source: SOURCE
      reload:
        name: 重载
        aliases: []
        description: "重新加载配置、看板和语言文件"
      remove:
        name: 移除
        aliases: []
        description: "移除一块看板及其物品展示框"
        args:
          name: 名称
      render:
        name: 渲染
        aliases: []
        description: "当前的渲染方式和数据包计数"
      top:
        name: 排行
        aliases: []
        description: "使用中的排行榜、某个来源的前几名，或重置其存储的数值"
        args:
          source: 来源
          action: 重置
          confirm: 确认
    values:
      close: 关闭
      open: 开启
      reset: 重置
      confirm: 确认
